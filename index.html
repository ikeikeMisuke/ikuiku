<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>イクイク選手権</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: radial-gradient(circle at top, #380822 0%, #10020a 100%);
      color: #fff0f7;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .wrap {
      width: 100%;
      max-width: 440px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .shake {
      animation: shakeAnim 0.3s ease;
    }
    @keyframes shakeAnim {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-6px); }
    }
    .flash-go {
      box-shadow: 0 0 28px rgba(255, 215, 0, 0.85) !important;
      border-color: #ffd700 !important;
    }

    .stage {
      background: linear-gradient(180deg, #4b0d2f 0%, #210514 100%);
      border: 2px solid #b8256f;
      border-radius: 18px;
      padding: 18px 14px;
      text-align: center;
      transition: all 0.12s ease;
    }
    .status-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 3px 12px;
      border-radius: 999px;
      background: #6e1443;
      color: #ffb3d9;
      border: 1px solid #ff4d94;
      margin-bottom: 8px;
    }
    .status-badge.go {
      background: #ffd700;
      color: #240412;
      border-color: #fff3a1;
      animation: pulse 0.25s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.06); }
    }
    .s-face {
      font-size: 3.5rem;
      line-height: 1.1;
      margin-bottom: 8px;
    }
    .line-box {
      background: #fff0f7;
      color: #240515;
      border-radius: 14px;
      padding: 14px 12px;
      font-size: 0.98rem;
      font-weight: bold;
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.45;
    }
    .line-box.go-text {
      background: #fff8cc;
      color: #99003d;
      font-size: 1.22rem;
      border: 2px solid #ff1a75;
    }

    /* スタート画面 */
    .start-card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid #8c2358;
      border-radius: 16px;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .rule-box {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      padding: 12px;
      font-size: 0.84rem;
      line-height: 1.6;
      color: #f7cde2;
      text-align: left;
    }
    .rule-box strong {
      color: #ff80bf;
    }
    .start-btn {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(90deg, #ff1a75, #c2004d);
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(255, 26, 117, 0.45);
    }
    .start-btn:active {
      transform: scale(0.97);
    }

    /* プレイ中ボタン */
    .btn-area {
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .sub-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .sub-btn {
      padding: 13px 8px;
      border-radius: 12px;
      border: 1px solid #8c2358;
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
      font-size: 0.88rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.07s, background 0.12s;
    }
    .sub-btn:active {
      transform: scale(0.96);
      background: rgba(255, 77, 148, 0.25);
    }

    .iku-btn {
      width: 100%;
      padding: 18px;
      border-radius: 16px;
      border: 2px solid #ff80bf;
      background: linear-gradient(90deg, #ff1a75, #c2004d);
      color: #fff;
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 26, 117, 0.45);
      transition: transform 0.06s;
    }
    .iku-btn:active {
      transform: scale(0.96);
    }

    /* リザルト画面 */
    .result-card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid #8c2358;
      border-radius: 16px;
      padding: 18px 14px;
      text-align: center;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .big-time {
      font-size: 2.3rem;
      font-weight: 900;
      color: #ffd700;
    }
    .retry-btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: #ff3385;
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="stage" id="stage">
      <div class="status-badge" id="statusBadge">🏆 イクイク選手権 🏆</div>
      <div class="s-face" id="sFace">😈</div>
      <div class="line-box" id="lineBox">
        「さあ、私の言葉にちゃんと従えるかしら？『いっていいよ』の瞬間を見逃さないでね。」
      </div>
    </div>

    <!-- スタート＆説明画面 -->
    <div class="start-card" id="startCard">
      <div class="rule-box">
        <strong>【遊び方】</strong><br>
        ① S女の焦らしターンでは、指示に合った<strong>正解ボタン</strong>を押して進もう（違うボタンを押すと進めない！）。<br>
        ② 「いっていいよ」が出る前に<strong>「イク」</strong>を押すとフライング失格！<br>
        ③ <strong>「いっていいよ」</strong>が出た瞬間に<strong>「イク」</strong>を押し、かかった秒数を友達と競おう！
      </div>
      <button class="start-btn" onclick="startGame()">スタート</button>
    </div>

    <!-- プレイ画面 -->
    <div class="btn-area" id="playArea">
      <div class="sub-grid" id="subGrid"></div>
      <button class="iku-btn" id="ikuBtn" onpointerdown="pressIku()">💥 イク 💥</button>
    </div>

    <!-- リザルト画面 -->
    <div class="result-card" id="resultCard">
      <div style="font-size:0.85rem; color:#ffb3d9;" id="resultLabel">「いっていいよ」からの反応タイム</div>
      <div class="big-time" id="bigTime">0.000秒</div>
      <div style="font-size:0.95rem; font-weight:bold; color:#ff80bf;" id="rankTitle"></div>
      <div style="font-size:0.84rem; line-height:1.5; color:#f2c9de;" id="resultComment"></div>
      <button class="retry-btn" onclick="startGame()">もう一回勝負する</button>
    </div>
  </div>

  <script>
    const teasePhases = [
      {
        badge: "焦らしフェーズ 1/3",
        face: "😈",
        text: "「まだだよ〜勝手にイクなよ、まずお礼は？」",
        required: "ありがとうございます",
        wrongReply: "「お礼も言えないの？」"
      },
      {
        badge: "焦らしフェーズ 2/3",
        face: "👠",
        text: "「情けないね、惨めだね、ほら我慢しろ」",
        required: "我慢",
        wrongReply: "「ダメダメ。ちゃんと我慢しなさい」"
      },
      {
        badge: "焦らしフェーズ 3/3",
        face: "😏",
        text: "「焦らされてどう？正直嬉しい？気持ちいい？笑」",
        required: "気持ちいいです",
        wrongReply: "「気持ちいいですって言え〜」"
      }
    ];

    const allChoices = [
      "ありがとうございます",
      "我慢",
      "気持ちいいです",
      "イかない",
      "気持ちいい",
      "もう限界…",
      "すみません",
      "まだ我慢します"
    ];

    let phaseIndex = 0;
    let isAllowed = false;
    let goStartTime = 0;
    let gameStartTime = 0;
    let isFinished = false;

    const wrap = document.getElementById("wrap");
    const stage = document.getElementById("stage");
    const statusBadge = document.getElementById("statusBadge");
    const sFace = document.getElementById("sFace");
    const lineBox = document.getElementById("lineBox");
    const startCard = document.getElementById("startCard");
    const playArea = document.getElementById("playArea");
    const subGrid = document.getElementById("subGrid");
    const resultCard = document.getElementById("resultCard");

    function triggerShake() {
      wrap.classList.remove("shake");
      void wrap.offsetWidth;
      wrap.classList.add("shake");
    }

    function renderChoices(requiredLabel) {
      const pool = allChoices.filter(c => c !== requiredLabel);
      const distractors = [...pool].sort(() => Math.random() - 0.5).slice(0, 3);
      const fourButtons = [requiredLabel, ...distractors].sort(() => Math.random() - 0.5);

      subGrid.innerHTML = "";
      fourButtons.forEach(label => {
        const btn = document.createElement("button");
        btn.className = "sub-btn";
        btn.textContent = label;
        btn.onpointerdown = () => handleChoice(label, requiredLabel);
        subGrid.appendChild(btn);
      });
    }

    function loadTeasePhase() {
      const p = teasePhases[phaseIndex];
      statusBadge.textContent = p.badge;
      sFace.textContent = p.face;
      lineBox.textContent = p.text;
      renderChoices(p.required);
    }

    function startGame() {
      phaseIndex = 0;
      isAllowed = false;
      isFinished = false;
      gameStartTime = performance.now();

      startCard.style.display = "none";
      resultCard.style.display = "none";
      playArea.style.display = "flex";

      stage.classList.remove("flash-go");
      lineBox.classList.remove("go-text");
      statusBadge.classList.remove("go");

      loadTeasePhase();
    }

    function triggerGoMoment() {
      if (isFinished) return;
      isAllowed = true;
      goStartTime = performance.now();

      stage.classList.add("flash-go");
      lineBox.classList.add("go-text");
      statusBadge.classList.add("go");
      statusBadge.textContent = "🔥 解禁！「イク」を押せ！！";
      sFace.textContent = "👑";
      lineBox.textContent = "「もういいよ、いけ」";
    }

    function handleChoice(selectedLabel, requiredLabel) {
      if (isFinished) return;

      if (isAllowed) {
        lineBox.textContent = "「いっていいよ言ってるだろ 早くいけよ」";
        return;
      }

      if (selectedLabel === requiredLabel) {
        phaseIndex++;
        if (phaseIndex < teasePhases.length) {
          loadTeasePhase();
        } else {
          statusBadge.textContent = "焦らし最終カウントダウン…";
          sFace.textContent = "💋";
          lineBox.textContent = "「ちゃんと言うこと聞けてえらいね、いついっていいよって言おうかな？」";
          subGrid.innerHTML = "";
          const delayMs = 600 + Math.random() * 1400;
          setTimeout(triggerGoMoment, delayMs);
        }
      } else {
        triggerShake();
        const p = teasePhases[phaseIndex];
        lineBox.textContent = p.wrongReply;
      }
    }

    function pressIku() {
      if (isFinished) return;

      if (!isAllowed) {
        isFinished = true;
        triggerShake();
        playArea.style.display = "none";
        resultCard.style.display = "flex";

        document.getElementById("resultLabel").textContent = "❌ フライング失格！";
        document.getElementById("bigTime").textContent = "OUT";
        document.getElementById("rankTitle").textContent = "称号：我慢ゼロの早漏雑魚";
        document.getElementById("resultComment").textContent =
          "「は？まだ『いっていいよ』って言ってないでしょこの早漏！勝手にイくとか本当みっともないゴミね。」";
        return;
      }

      isFinished = true;
      const now = performance.now();
      const reactionSec = (now - goStartTime) / 1000;
      const totalSec = (now - gameStartTime) / 1000;

      playArea.style.display = "none";
      resultCard.style.display = "flex";

      document.getElementById("resultLabel").textContent =
        `「いっていいよ」からの反応タイム（総合 ${totalSec.toFixed(2)}秒）`;
      document.getElementById("bigTime").textContent = `${reactionSec.toFixed(3)}秒`;

      let rank = "";
      let comment = "";

      if (reactionSec < 0.555) {
        rank = "⚡ 即イキM";
        comment = "「どんだけ飢えてんの即イキマゾ。画面張り付いて指プルプルさせててめっちゃキモイ」";
      } else if (reactionSec < 1.0) {
        rank = "🔥 素直すぎる従順M";
        comment = "「はいはい、言われた通りにすぐ反応して偉いわね〜♡ ほんと脳みそお花畑の素直すぎる従順Mなんだから、都合よすぎ！」";
      } else {
        rank = "🐢 鈍臭いポンコツM";
        comment = "「1秒もかかってて何やってんの？『いっていいよ』って言われてからボーッとするなよ、この鈍臭いポンコツMが！」";
      }

      document.getElementById("rankTitle").textContent = rank;
      document.getElementById("resultComment").textContent = comment;
    }
  </script>
</body>
</html>
